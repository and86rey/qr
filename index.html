<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Offline QR Code Generator</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            display: flex;
            justify-content: center;
        }
        .app {
            width: 100%;
            max-width: 640px;
            background: radial-gradient(circle at top left, #1e293b 0, #020617 60%);
            border-radius: 18px;
            padding: 24px 20px 28px;
            box-shadow: 0 18px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(148,163,184,0.3);
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }
        .logo-dot {
            width: 26px;
            height: 26px;
            border-radius: 999px;
            background: conic-gradient(from 200deg, #22c55e, #3b82f6, #a855f7, #22c55e);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 3px rgba(15,23,42,0.8);
        }
        .logo-inner {
            width: 14px;
            height: 14px;
            border-radius: 999px;
            background: #020617;
        }
        .title-block { display: flex; flex-direction: column; }
        .title { font-size: 18px; font-weight: 600; letter-spacing: 0.03em; }
        .subtitle { font-size: 13px; color: #9ca3af; }

        label { font-size: 13px; color: #9ca3af; }
        .input-row { margin-bottom: 14px; }
        textarea {
            width: 100%;
            min-height: 68px;
            resize: vertical;
            padding: 10px 11px;
            border-radius: 10px;
            border: 1px solid rgba(148,163,184,0.4);
            background: rgba(15,23,42,0.9);
            color: #e5e7eb;
            font-size: 14px;
            line-height: 1.4;
        }
        textarea:focus {
            outline: 2px solid #38bdf8;
            outline-offset: 1px;
            border-color: transparent;
        }
        textarea::placeholder { color: #6b7280; }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }
        .controls-left {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 999px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
        }
        button:active { transform: translateY(1px); }

        .btn-generate {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #f9fafb;
            box-shadow: 0 8px 20px rgba(16,185,129,0.35);
        }
        .btn-generate:hover {
            background: linear-gradient(135deg, #16a34a, #15803d);
        }
        .btn-clear {
            background: rgba(15,23,42,0.9);
            color: #9ca3af;
            border: 1px solid rgba(148,163,184,0.4);
        }
        .btn-clear:hover {
            border-color: #e5e7eb;
            color: #e5e7eb;
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            color: #9ca3af;
        }
        .status-ok { color: #4ade80; }
        .status-error { color: #f97373; }

        .qr-panel {
            margin-top: 10px;
            padding: 14px;
            border-radius: 16px;
            background: radial-gradient(circle at top right, rgba(37,99,235,0.20), rgba(15,23,42,0.95));
            border: 1px solid rgba(148,163,184,0.3);
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .qr-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            border-radius: 20px;
            padding: 18px;
            background: radial-gradient(circle at 10% 0, #020617, #020617 50%, #0b1120 90%);
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .qr-inner {
            background: #f9fafb;
            border-radius: 16px;
            width: 100%;
            height: 100%;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas#qrCanvas {
            image-rendering: pixelated;
            width: 100%;
            height: 100%;
        }

        .qr-info {
            min-width: 180px;
            max-width: 260px;
            font-size: 13px;
            color: #9ca3af;
        }
        .qr-info strong { color: #e5e7eb; }

        .download-row {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        a.download-link {
            text-decoration: none;
            border-radius: 999px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid rgba(148,163,184,0.6);
            color: #e5e7eb;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        a.download-link[aria-disabled="true"] {
            opacity: 0.4;
            pointer-events: none;
        }
        .chip {
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 999px;
            background: rgba(15,23,42,0.9);
            border: 1px solid rgba(148,163,184,0.4);
            color: #9ca3af;
        }
        .error-text {
            margin-top: 6px;
            font-size: 12px;
            color: #f97373;
        }

        @media (max-width: 600px) {
            body { padding: 16px; }
            .app { padding: 18px 14px 22px; }
            .qr-wrapper {
                width: 220px;
                height: 220px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="header">
        <div class="logo-dot"><div class="logo-inner"></div></div>
        <div class="title-block">
            <div class="title">Offline QR Generator</div>
            <div class="subtitle">Paste any link or text, get a scannable PNG QR code.</div>
        </div>
    </header>

    <main>
        <div class="input-row">
            <label for="qrText">Content to encode</label>
            <textarea id="qrText" placeholder="https://example.com/your-link or any plain text"></textarea>
        </div>

        <div class="controls">
            <div class="controls-left">
                <button type="button" class="btn-generate" id="btnGenerate">Generate QR</button>
                <button type="button" class="btn-clear" id="btnClear">Clear</button>
            </div>
            <div class="status" id="statusLabel">Idle</div>
        </div>

        <div class="qr-panel">
            <div class="qr-wrapper">
                <div class="qr-inner">
                    <canvas id="qrCanvas" width="240" height="240"></canvas>
                </div>
            </div>
            <div class="qr-info">
                <div><strong>How it works</strong></div>
                <p>
                    Everything runs locally in your browser: no network calls or CDNs.
                    The QR is rendered to a fixed 240×240 PNG that phone cameras can scan.
                </p>
                <div class="download-row">
                    <a id="downloadLink" class="download-link" aria-disabled="true" href="#">
                        Download PNG (240×240)
                    </a>
                    <span class="chip" id="metaInfo">No code yet</span>
                </div>
                <div class="error-text" id="errorText" style="display:none;"></div>
            </div>
        </div>
    </main>
</div>

<script>
(function () {
    const textEl = document.getElementById('qrText');
    const canvas = document.getElementById('qrCanvas');
    const btnGenerate = document.getElementById('btnGenerate');
    const btnClear = document.getElementById('btnClear');
    const downloadLink = document.getElementById('downloadLink');
    const statusLabel = document.getElementById('statusLabel');
    const errorText = document.getElementById('errorText');
    const metaInfo = document.getElementById('metaInfo');

    function setStatus(msg, type) {
        statusLabel.textContent = msg;
        statusLabel.classList.remove('status-ok', 'status-error');
        if (type === 'ok') statusLabel.classList.add('status-ok');
        if (type === 'error') statusLabel.classList.add('status-error');
    }

    function setError(msg) {
        if (!msg) {
            errorText.style.display = 'none';
            errorText.textContent = '';
        } else {
            errorText.style.display = 'block';
            errorText.textContent = msg;
        }
    }

    function generateQr() {
        const text = textEl.value.trim();
        if (!text) {
            setStatus('Please enter text or URL', 'error');
            setError('Input is empty. Paste a link or type some text.');
            downloadLink.setAttribute('aria-disabled', 'true');
            metaInfo.textContent = 'No code yet';
            return;
        }

        try {
            const qr = new QRCode(canvas, {
                width: canvas.width,
                height: canvas.height,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });
            qr.clear();
            qr.makeCode(text);

            const dataURL = canvas.toDataURL("image/png");
            downloadLink.href = dataURL;
            downloadLink.download = "qr-code.png";
            downloadLink.setAttribute('aria-disabled', 'false');
            metaInfo.textContent = 'PNG 240×240, ECC M';
            setStatus('QR generated', 'ok');
            setError('');
        } catch (e) {
            console.error(e);
            setStatus('Encoding error', 'error');
            setError('Failed to generate QR code.');
            downloadLink.setAttribute('aria-disabled', 'true');
            metaInfo.textContent = 'Error';
        }
    }

    function clearAll() {
        textEl.value = '';
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        downloadLink.setAttribute('aria-disabled', 'true');
        metaInfo.textContent = 'No code yet';
        setStatus('Idle');
        setError('');
    }

    btnGenerate.addEventListener('click', generateQr);
    btnClear.addEventListener('click', clearAll);
    textEl.addEventListener('keydown', function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'enter') {
            e.preventDefault();
            generateQr();
        }
    });

    // Initialize canvas as white so downloads are valid images even before first QR
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
})();
</script>
