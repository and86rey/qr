<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Standalone QR Generator – CV Style (No APIs)</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8f8f8; }
        input, button { padding: 12px; font-size: 16px; }
        input { width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        canvas { border: 1px solid #ddd; background: white; margin-top: 20px; }
        .download { margin-top: 10px; padding: 10px 20px; background: #0066cc; color: white; text-decoration: none; border-radius: 4px; display:inline-block; }
    </style>
</head>
<body>

<h1>Standalone QR Code Generator – CV Style</h1>

<input type="text" id="text" placeholder="Enter URL, vCard, Wi-Fi, etc."
       value="https://www.linkedin.com/in/andreyzakharov">
<button id="generateBtn">Generate QR</button>
<br><br>

<canvas id="qrCanvas" width="340" height="340"></canvas>
<br>
<a id="dl" class="download" style="display:none;" download="qr-code-cv-style.png">
    Download PNG (340x340)
</a>

<!-- Your standalone QR implementation -->
<script src="qr.js"></script>

</body>
</html>
